[project]
name = "rag-mcp"
version = "0.3.0"
description = "Local GraphRAG MCP server for the noory-ai `rag` plugin (no API keys required)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "anyio>=4.4.0",
  "pydantic>=2.7.0",
  "sqlite-vec>=0.1.6",
  "kuzu>=0.7.1",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
  "networkx>=3.3",
  "python-igraph>=0.11.6",
  "leidenalg>=0.10.2",
  "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "reportlab>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.pytest.ini_options]
markers = [
  "slow: tests that download large models or run multi-second pipelines",
]
testpaths = ["tests"]
