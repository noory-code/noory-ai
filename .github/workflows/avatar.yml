name: avatar

on:
  push:
    paths:
      - "avatar/**"
      - ".github/workflows/avatar.yml"
  pull_request:
    paths:
      - "avatar/**"
      - ".github/workflows/avatar.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest (26.04) ships no Python 3.9; keep 3.9 covered on the previous LTS.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test
        run: python -m unittest discover -s avatar/tests -q
