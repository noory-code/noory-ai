[project]
name = "solera-map"
version = "0.1.0"
description = "Mindmap-style visual layer for Solera projects — Service / Plan / Build / Live canvases over Solera data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
keywords = ["claude-code", "mcp", "solera", "mindmap", "product-map"]
dependencies = [
    "fastmcp>=2.0",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "watchdog>=4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
solera-map = "solera_map.__main__:main"
solera-map-http = "solera_map.__main__:http_only"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solera_map"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.10",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
    "httpx>=0.28.1",
]
