<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plot</title>
    <script>
      // Pre-paint theme (D-2026-06-08-A): apply `.dark` on <html> BEFORE React
      // mounts, to avoid a flash of the wrong theme. This mirrors
      // theme/ThemeProvider (readStoredChoice -> resolveTheme -> applyTheme) but
      // cannot import the ESM module this early. The literals ("plot:theme",
      // the media query, the "dark" class) are duplicated ON PURPOSE and pinned
      // against the source of truth by tests/theme-fouc.test.ts.
      (function () {
        try {
          var choice = localStorage.getItem("plot:theme");
          if (choice !== "light" && choice !== "dark" && choice !== "system") choice = "system";
          var dark =
            choice === "dark" ||
            (choice === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode / no matchMedia — fall back to light */
        }
      })();
    </script>
    <script>
      // Debug-flavor boot beacon (D-2026-06-10-B): posts page-boot + JS errors
      // to the engine debug channel INDEPENDENTLY of the module graph, so a
      // failed bundle import is distinguishable from a dead engine. The
      // %VITE_*% tokens are replaced at build time; in release builds the
      // guard is false (or the token survives verbatim) and nothing runs.
      (function () {
        if ("%VITE_PLOT_DEBUG%" !== "1") return;
        var base = "%VITE_PLOT_ENGINE%";
        if (base.indexOf("%") !== -1) base = "";
        var post = function (payload) {
          try {
            fetch(base + "/api/debug", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(payload),
            }).catch(function () {});
          } catch (e) {
            /* beacon must never break the page */
          }
        };
        window.addEventListener("error", function (e) {
          post({
            beacon: "error",
            message: String(e.message || e),
            source: String(e.filename || ""),
            line: e.lineno || 0,
          });
        });
        window.addEventListener("unhandledrejection", function (e) {
          post({
            beacon: "rejection",
            message: String((e.reason && e.reason.message) || e.reason),
          });
        });
        post({ beacon: "boot", href: location.href, ua: navigator.userAgent });
      })();
    </script>
  </head>
  <body class="bg-surface text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
